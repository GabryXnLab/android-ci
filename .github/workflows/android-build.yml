name: Android Build (reusable)

# Workflow riusabile per app Android NATIVE (Gradle, Kotlin/Compose) con un'eventuale libreria
# nativa Rust compilata da Gradle con cargo-ndk. Fratello di `expo-build.yml` e `gpui-build.yml`:
# stessi input comuni (runner, max_workers, clear_cache), stesso build-kit per worker e cache,
# stessa firma col keystore del runner, stessa notifica. Chiamato da thin wrapper via:
#   uses: GabryXnLab/android-ci/.github/workflows/android-build.yml@main
#
# Il progetto decide cosa compila Gradle (`gradle_task`): se un suo task lancia cargo-ndk, qui ci
# sono toolchain Rust e cargo-ndk già pronti (input `rust`).

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nome app (titolo delle notifiche Telegram)'
        required: true
        type: string
      runner:
        description: >-
          self-hosted (nexus-core, ARM64) | github (runner GitHub-hosted) | auto (sceglie
          build-kit/pick-runner: nexus-core, ohos o Ubicloud, il primo con capacità libera)
        required: false
        default: 'self-hosted'
        type: string
      max_workers:
        description: >-
          Worker di Gradle/cargo (e di CMake) per questo run. auto = sul self-hosted le CPU libere
          in quel momento, mai sotto 2; su GitHub tutte | 2 | 4. Stesso input, stessi valori e
          stesso significato in flutter-ci, expo-ci, desktop-ci e android-ci (GabryXnLab/build-kit).
        required: false
        default: 'auto'
        type: string
      clear_cache:
        description: >-
          Sul self-hosted cancella la cartella target di cargo del repo e, per questo run, Gradle,
          ccache e sccache ricompilano invece di fidarsi delle cache condivise (che non si
          cancellano mai). Su GitHub il run non riprende né salva le cache.
        required: false
        default: false
        type: boolean
      project_dir:
        description: 'Cartella del progetto Gradle (con gradlew), relativa alla radice del repo'
        required: false
        default: '.'
        type: string
      gradle_task:
        description: 'Task Gradle da lanciare (spazio-separati). Con debug=true si usa :app:assembleDebug.'
        required: false
        default: ':app:assembleRelease'
        type: string
      abis:
        description: 'ABI delle librerie native, CSV, passate a Gradle come -Priftgate.abis (es. arm64-v8a,x86_64)'
        required: false
        default: 'arm64-v8a,x86_64'
        type: string
      abis_property:
        description: 'Nome della proprietà Gradle che riceve le ABI'
        required: false
        default: 'riftgate.abis'
        type: string
      debug:
        description: 'true → :app:assembleDebug invece di gradle_task'
        required: false
        default: false
        type: boolean
      signing_keystore:
        description: >-
          Nome del keystore con cui FIRMARE l'APK (senza estensione): il runner lo cerca in
          /home/ubuntu/secrets/<nome>.jks + <nome>.properties (storePassword, keyAlias,
          keyPassword), oppure nei secret ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PROPERTIES.
          Vuoto = la firma che il progetto configura da sé (di norma quella di debug). Dichiarato
          e introvabile = job fallito; dopo la build l'impronta dell'APK è confrontata con quella
          del keystore.
        required: false
        default: ''
        type: string
      rust:
        description: 'true → toolchain Rust stable, cargo-ndk (in ~/ci/tools) e sccache condiviso, per un progetto che compila Rust con cargo-ndk da Gradle'
        required: false
        default: true
        type: boolean
      cargo_ndk_version:
        description: 'Versione di cargo-ndk (installata in ~/ci/tools/cargo-ndk/<versione>)'
        required: false
        default: '4.1.2'
        type: string
      cargo_target_in_checkout:
        description: 'true → Gradle lancia cargo senza CARGO_TARGET_DIR: la cartella target resta nel checkout (per script che cercano target/ accanto al crate)'
        required: false
        default: false
        type: boolean
      ndk_version:
        description: 'Versione dell NDK (self-hosted: quella già in /opt/android-sdk; GitHub: installata con sdkmanager se manca)'
        required: false
        default: '27.3.13750724'
        type: string
      github_runner_label:
        description: 'runs-on con runner=github (ubuntu-24.04 x86-64, o ubuntu-24.04-arm se l NDK scelto ha una toolchain per quell host)'
        required: false
        default: 'ubuntu-24.04'
        type: string
      selfhosted_runner:
        description: 'runs-on con runner=self-hosted (JSON array)'
        required: false
        default: '["self-hosted","nexus-core"]'
        type: string
      allow:
        description: 'Con runner=auto: livelli ammessi (nexus,ohos,ubicloud). Serve a provare un livello solo, es. ubicloud.'
        required: false
        default: 'nexus,ohos,ubicloud'
        type: string
      flake_dir:
        description: 'Solo profilo ohos: cartella del flake (flake.nix, flake.lock) con il devShell Android/Rust, relativa alla radice del repo.'
        required: false
        default: '.'
        type: string
      pick_repos:
        description: 'Con runner=auto: repo in cui contare i job in coda (nome, virgola-separati)'
        required: false
        default: 'kagami-private,Riftgate,ascend'
        type: string
      ubicloud_size:
        description: 'Con runner=auto: vCPU di ubicloud-standard-<N>'
        required: false
        default: '8'
        type: string
      remote_cache:
        description: 'true → cache remota (build-kit/setup) anche su nexus-core; su ohos e Ubicloud con auto è sempre accesa'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch/tag/SHA da buildare. Vuoto = quello del run.'
        required: false
        default: ''
        type: string
      artifact_name:
        description: 'Nome dell artifact del run. Vuoto = app_name.'
        required: false
        default: ''
        type: string
      telegram_topic_id:
        description: 'Topic del supergruppo Telegram per la notifica (message_thread_id). Vuoto = nessuna notifica.'
        required: false
        default: ''
        type: string
      updater_artifact:
        description: >-
          Nome dell'artifact (es. packages-android-arm64: la cartella dice OS e ABI) che porta l'APK appena costruito con la
          sua firma minisign `.sig` (stessa chiave dell'updater desktop, TAURI_SIGNING_PRIVATE_KEY),
          piatto e senza suffisso: è il formato di cartella che il job `publish` di gpui-build.yml
          raccoglie per comporre il manifest. L'APK deve essere uno solo (una ABI per run). Vuoto = niente.
        required: false
        default: ''
        type: string
      cargo_packager_version:
        description: 'Versione di cargo-packager, usato solo per firmare (`signer sign`) con updater_artifact'
        required: false
        default: '0.11.8'
        type: string
    outputs:
      cache_summary:
        description: 'Riga compatta chiave=valore di build-kit/summary (runner, arch, fasi, sccache, gradle, s3).'
        value: ${{ jobs.build.outputs.cache_summary }}
    secrets:
      RUNNER_PICK_TOKEN:
        required: false
      BUILD_CACHE_S3:
        required: false
      # Firma di release nei secret del repo (stessi nomi in tutti gli stack): hanno la precedenza sul
      # keystore della macchina e sui vecchi ANDROID_KEYSTORE_*.
      RELEASE_KEYSTORE_B64:
        required: false
      RELEASE_KEYSTORE_PASSWORD:
        required: false
      RELEASE_KEY_ALIAS:
        required: false
      RELEASE_KEY_PASSWORD:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PROPERTIES:
        required: false
      # Chiave minisign dell'updater (stesso formato di gpui-build.yml): firma l'APK di updater_artifact.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  pick:
    if: ${{ inputs.runner == 'auto' }}
    runs-on: ubuntu-slim
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      profile: ${{ steps.pick.outputs.profile }}
    steps:
      - id: pick
        uses: GabryXnLab/build-kit/pick-runner@main
        with:
          token: ${{ secrets.RUNNER_PICK_TOKEN }}
          repos: ${{ inputs.pick_repos }}
          ubicloud_size: ${{ inputs.ubicloud_size }}
          # Una firma che esiste solo sul disco di nexus-core vincola la build a nexus-core.
          allow: ${{ inputs.signing_keystore != '' && secrets.RELEASE_KEYSTORE_B64 == '' && secrets.ANDROID_KEYSTORE_BASE64 == '' && 'nexus' || inputs.allow }}

  build:
    name: Android ${{ inputs.debug && 'debug' || 'build' }} (${{ inputs.abis }})
    needs: pick
    if: ${{ !cancelled() && needs.pick.result != 'failure' }}
    runs-on: ${{ inputs.runner == 'auto' && fromJSON(needs.pick.outputs.runs_on) || inputs.runner == 'github' && fromJSON(format('["{0}"]', inputs.github_runner_label)) || fromJSON(inputs.selfhosted_runner) }}
    outputs:
      cache_summary: ${{ steps.cache_summary.outputs.line }}
    defaults:
      run:
        shell: bash
    env:
      # Dipendenze come archivi sul bucket S3 (build-kit/s3-cache) al posto di actions/cache e
      # rust-cache, solo con ohos e Ubicloud; nexus e il runner GitHub restano come prima.
      S3C_GRADLE: gradle-modules|~/.gradle/caches/modules-2|**/*.gradle,**/*.gradle.kts,**/gradle-wrapper.properties,**/libs.versions.toml|gradle-1
      S3C_WRAPPER: gradle-wrapper|~/.gradle/wrapper/dists|**/gradle-wrapper.properties|gradle-1
      S3C_CARGO: ${{ inputs.rust && 'cargo-registry|~/.cargo/registry ~/.cargo/git|**/Cargo.lock|rust-stable' || '' }}
    steps:
      # profile decide gli step: nexus (ARM64, cartelle di /home/ubuntu e /opt), ohos (self-hosted
      # senza quelle cartelle), ephemeral (GitHub o Ubicloud, x86-64, macchina nuova a ogni job).
      - name: Validate inputs and resolve profile
        id: profile
        env:
          RUNNER_KIND: ${{ inputs.runner }}
          PICKED: ${{ needs.pick.outputs.profile }}
          REMOTE_CACHE_INPUT: ${{ inputs.remote_cache }}
        run: |
          set -euo pipefail
          case "$RUNNER_KIND" in
            self-hosted) PROFILE=nexus; SETUP_RUNNER=self-hosted ;;
            github)      PROFILE=ephemeral; SETUP_RUNNER=github ;;
            auto)
              PROFILE=$PICKED
              case "$PROFILE" in
                nexus) SETUP_RUNNER=self-hosted ;;
                ohos) SETUP_RUNNER=ohos ;;
                ephemeral) SETUP_RUNNER=ubicloud ;;
                *) echo "::error::profilo del runner scelto non valido: '$PROFILE'"; exit 1 ;;
              esac ;;
            *) echo "::error::runner non valido: '$RUNNER_KIND' (attesi: self-hosted | github | auto)"; exit 1 ;;
          esac
          REMOTE=false
          if [ "$REMOTE_CACHE_INPUT" = "true" ] || { [ "$RUNNER_KIND" = "auto" ] && [ "$PROFILE" != "nexus" ]; }; then REMOTE=true; fi
          echo "Profilo $PROFILE (runner=$RUNNER_KIND, setup=$SETUP_RUNNER, cache remota=$REMOTE)"
          {
            echo "value=$PROFILE"
            echo "setup_runner=$SETUP_RUNNER"
            echo "remote_cache=$REMOTE"
            echo "s3c=$([ "$RUNNER_KIND" = "auto" ] && [ "$PROFILE" != "nexus" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Notify start via Telegram
        id: started
        uses: GabryXnLab/build-kit/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: started
          title: ${{ inputs.app_name }} ${{ inputs.debug && 'debug' || 'release' }} (Android)

      # Il checkout pulisce solo su GitHub (macchina nuova) o con clear_cache: sul self-hosted gli
      # intermedi di Gradle e di cargo restano fra i run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: ${{ steps.profile.outputs.value != 'nexus' || inputs.clear_cache == true }}

      # ohos (NixOS): JDK, SDK, NDK e toolchain Rust arrivano dal devShell del flake del progetto, non da
      # rustup/apt. Prima di `setup`, che aggiunge i suoi -D a GRADLE_OPTS del devShell (aapt2 nello store).
      - name: Nix devShell (ohos)
        if: ${{ steps.profile.outputs.value == 'ohos' }}
        uses: GabryXnLab/build-kit/nix-env@main
        with:
          flake_dir: ${{ inputs.flake_dir }}

      - name: Tune build
        id: tune
        uses: GabryXnLab/build-kit/setup@main
        with:
          runner: ${{ steps.profile.outputs.setup_runner }}
          max_workers: ${{ inputs.max_workers }}
          clear_cache: ${{ inputs.clear_cache }}
          rust: ${{ inputs.rust && 'true' || 'false' }}
          remote_cache: ${{ steps.profile.outputs.remote_cache }}
          cache_env: ${{ steps.profile.outputs.value == 'ephemeral' && secrets.BUILD_CACHE_S3 || '' }}

      # ── Ambiente Android ───────────────────────────────────────────────────────────────
      # Self-hosted: JDK, SDK e NDK condivisi della macchina, che si usano e non si modificano.
      - name: Android environment (ohos)
        if: ${{ steps.profile.outputs.value == 'ohos' }}
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          # SDK, NDK e JDK di ohos arrivano dal devShell caricato da build-kit/nix-env.
          : "${ANDROID_HOME:?ohos: ANDROID_HOME non impostato, toolchain Android non pronta}"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION" || { echo "::error::NDK $NDK_VERSION non trovato in $ANDROID_HOME/ndk"; exit 1; }
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Android environment (self-hosted)
        if: ${{ steps.profile.outputs.value == 'nexus' }}
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          {
            echo "ANDROID_HOME=/opt/android-sdk"
            echo "ANDROID_SDK_ROOT=/opt/android-sdk"
            echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=/opt/android-sdk/ndk/$NDK_VERSION"
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
          } >> "$GITHUB_ENV"
          test -d "/opt/android-sdk/ndk/$NDK_VERSION" || { echo "::error::NDK $NDK_VERSION non trovato in /opt/android-sdk/ndk"; exit 1; }

      # Google non pubblica un NDK per host Linux aarch64: la toolchain della macchina è patchata
      # per usare clang nativo invece di QEMU (idempotente, la patch è già sul NDK condiviso).
      - name: Patch NDK aarch64 host toolchain
        if: ${{ steps.profile.outputs.value == 'nexus' && inputs.rust }}
        uses: GabryXnLab/expo-ci/setup-ndk-aarch64-host@main

      - name: Setup JDK 17 (GitHub runner)
        if: ${{ steps.profile.outputs.value == 'ephemeral' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # I runner GitHub hanno già un SDK; l'NDK richiesto si installa se manca.
      - name: Android SDK and NDK (GitHub runner)
        if: ${{ steps.profile.outputs.value == 'ephemeral' }}
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          [ -d "$SDK/ndk/$NDK_VERSION" ] || "$SDKMANAGER" --install "ndk;$NDK_VERSION" >/dev/null
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Write local.properties
        id: paths
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          # Prefisso per i glob degli artefatti dalla radice del workspace (project_dir '.' = nessuno).
          d="${PROJECT_DIR#./}"; d="${d%/}"
          if [ "$d" = "." ] || [ -z "$d" ]; then echo "prefix=" >> "$GITHUB_OUTPUT"; else echo "prefix=$d/" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Rust
        if: ${{ inputs.rust && steps.profile.outputs.value != 'ohos' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Restore dependency archives (S3)
        if: ${{ steps.profile.outputs.s3c == 'true' }}
        uses: GabryXnLab/build-kit/s3-cache@main
        with:
          mode: restore
          stack: android
          items: |
            ${{ env.S3C_GRADLE }}
            ${{ env.S3C_WRAPPER }}
            ${{ env.S3C_CARGO }}
          cache_env: ${{ steps.profile.outputs.value == 'ephemeral' && secrets.BUILD_CACHE_S3 || '' }}
          clear_cache: ${{ inputs.clear_cache }}

      - name: Cargo cache (GitHub runner)
        if: ${{ steps.profile.outputs.value == 'ephemeral' && steps.profile.outputs.s3c != 'true' && inputs.rust && inputs.clear_cache != true }}
        uses: Swatinem/rust-cache@v2

      # cargo-ndk sta nella cartella degli strumenti della CI (~/ci/tools, come da build-kit),
      # mai installato di sistema; sui runner GitHub la cartella si riprende con actions/cache.
      - name: Cache cargo-ndk (GitHub runner)
        if: ${{ steps.profile.outputs.value == 'ephemeral' && inputs.rust }}
        uses: actions/cache@v4
        with:
          path: ~/ci/tools/cargo-ndk/${{ inputs.cargo_ndk_version }}
          key: cargo-ndk-${{ inputs.cargo_ndk_version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-ndk
        if: ${{ inputs.rust }}
        env:
          VER: ${{ inputs.cargo_ndk_version }}
        run: |
          set -euo pipefail
          tools="$HOME/ci/tools/cargo-ndk/$VER"
          if [ ! -x "$tools/bin/cargo-ndk" ]; then
            cargo install cargo-ndk --version "$VER" --locked --root "$tools"
          fi
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Gradle cache (GitHub runner)
        if: ${{ steps.profile.outputs.value == 'ephemeral' && inputs.clear_cache != true }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-disabled: ${{ steps.profile.outputs.s3c == 'true' }}

      # Solo le cartelle del progetto: le cache condivise della macchina (~/.gradle, ccache,
      # sccache) per questo run sono rese non fidate da build-kit/setup, non cancellate.
      - name: Clear project caches
        if: ${{ inputs.clear_cache == true }}
        working-directory: ${{ inputs.project_dir }}
        run: |
          rm -rf build app/build .gradle */build
          echo "Cache del progetto svuotate (clear_cache=true)"

      # Firma: un APK firmato con l'impronta sbagliata non si distingue a occhio da uno giusto,
      # e si vede solo sul dispositivo (Google Sign-In: DEVELOPER_ERROR). Dichiarato ma
      # introvabile = ERRORE: tornare in silenzio alla firma di debug darebbe un artefatto che
      # sembra buono.
      - name: Resolve release signing
        id: signing
        if: ${{ inputs.signing_keystore != '' }}
        env:
          RELEASE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          KEYSTORE_NAME: ${{ inputs.signing_keystore }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/signing"
          rm -rf "$DIR" && mkdir -p "$DIR" && chmod 700 "$DIR"
          if [ -n "${RELEASE_B64:-}" ] && [ -n "${RELEASE_STORE_PW:-}" ] && [ -n "${RELEASE_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PW:-}" ]; then
            echo "::add-mask::$RELEASE_STORE_PW"
            echo "::add-mask::$RELEASE_KEY_PW"
            printf '%s' "$RELEASE_B64" | base64 -d > "$DIR/ks.jks"
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RELEASE_STORE_PW" "$RELEASE_ALIAS" "$RELEASE_KEY_PW" > "$DIR/ks.properties"
            echo "Keystore '$KEYSTORE_NAME' dai secret RELEASE_* del repository."
          elif [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PROPS:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$DIR/ks.jks"
            printf '%s\n' "$KEYSTORE_PROPS" > "$DIR/ks.properties"
            echo "Keystore '$KEYSTORE_NAME' dai secret del repository."
          elif [ -f "/home/ubuntu/secrets/$KEYSTORE_NAME.jks" ] \
            && [ -f "/home/ubuntu/secrets/$KEYSTORE_NAME.properties" ]; then
            cp "/home/ubuntu/secrets/$KEYSTORE_NAME.jks" "$DIR/ks.jks"
            cp "/home/ubuntu/secrets/$KEYSTORE_NAME.properties" "$DIR/ks.properties"
            echo "Keystore '$KEYSTORE_NAME' dal runner (/home/ubuntu/secrets)."
          else
            echo "ERROR: signing_keystore='$KEYSTORE_NAME' ma il keystore non c'è: né i secret"
            echo "RELEASE_KEYSTORE_B64/RELEASE_KEYSTORE_PASSWORD/RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD,"
            echo "né ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PROPERTIES, né"
            echo "/home/ubuntu/secrets/$KEYSTORE_NAME.jks(+.properties) sul runner."
            exit 1
          fi
          chmod 600 "$DIR/ks.jks" "$DIR/ks.properties"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          # L'impronta attesa si legge dal keystore, non si scrive a mano da nessuna parte.
          STORE_PW=$(grep -E '^storePassword=' "$DIR/ks.properties" | cut -d= -f2-)
          echo "::add-mask::$STORE_PW"
          SHA1=$(keytool -list -v -keystore "$DIR/ks.jks" -storepass "$STORE_PW" 2>/dev/null \
                 | grep -m1 -oE 'SHA1: [0-9A-F:]+' | cut -d' ' -f2)
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "Firma release attesa: SHA-1 $SHA1"

      # Il daemon resta spento (il runner uccide i processi a fine job). Worker e parallelo
      # arrivano da GRADLE_OPTS (build-kit, input max_workers).
      - name: Gradle build
        id: build
        working-directory: ${{ inputs.project_dir }}
        env:
          GRADLE_TASK: ${{ inputs.debug && ':app:assembleDebug' || inputs.gradle_task }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
          ABIS: ${{ inputs.abis }}
          ABIS_PROPERTY: ${{ inputs.abis_property }}
          SIGNING_DIR: ${{ steps.signing.outputs.dir }}
          CARGO_IN_CHECKOUT: ${{ inputs.cargo_target_in_checkout }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          BUILD_CACHE_FLAG="--build-cache"
          if [ "$CLEAR_CACHE" = "true" ]; then BUILD_CACHE_FLAG=""; fi
          ARGS=()
          [ -z "$ABIS" ] || ARGS+=("-P$ABIS_PROPERTY=$ABIS")
          # Firma iniettata di AGP: sostituisce il signingConfig del buildType senza toccare il
          # build.gradle del progetto.
          if [ -n "${SIGNING_DIR:-}" ]; then
            STORE_PW=$(grep -E '^storePassword=' "$SIGNING_DIR/ks.properties" | cut -d= -f2-)
            KEY_ALIAS=$(grep -E '^keyAlias=' "$SIGNING_DIR/ks.properties" | cut -d= -f2-)
            KEY_PW=$(grep -E '^keyPassword=' "$SIGNING_DIR/ks.properties" | cut -d= -f2-)
            echo "::add-mask::$STORE_PW"
            echo "::add-mask::$KEY_PW"
            ARGS+=("-Pandroid.injected.signing.store.file=$SIGNING_DIR/ks.jks"
                   "-Pandroid.injected.signing.store.password=$STORE_PW"
                   "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
                   "-Pandroid.injected.signing.key.password=$KEY_PW")
          fi
          ENV_PREFIX=()
          if [ "$CARGO_IN_CHECKOUT" = "true" ]; then ENV_PREFIX=(env -u CARGO_TARGET_DIR); fi
          # shellcheck disable=SC2086
          "${ENV_PREFIX[@]}" ./gradlew $GRADLE_TASK --no-daemon $BUILD_CACHE_FLAG "${ARGS[@]}"
          if [ -n "${RUSTC_WRAPPER:-}" ]; then "$RUSTC_WRAPPER" --show-stats | grep -E 'Cache (hits|misses)' || true; fi

      - name: Verify artifact signature
        if: ${{ inputs.signing_keystore != '' }}
        working-directory: ${{ inputs.project_dir }}
        env:
          EXPECTED_SHA1: ${{ steps.signing.outputs.sha1 }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK=$(find . -path '*/build/outputs/apk/*' -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "ERROR: nessun APK da verificare (gradle_task non produce un APK?)"; exit 1; }
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
                   | grep -m1 -oE 'SHA-1 digest: [0-9a-f]+' | cut -d' ' -f3 \
                   | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          echo "Atteso : $EXPECTED_SHA1"
          echo "Trovato: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: l'APK NON è firmato con il keystore richiesto."
            exit 1
          fi

      # Sul self-hosted lo strumento resta in ~/ci/tools, una versione per cartella; su GitHub si compila nel run.
      - name: Install cargo-packager (signer)
        if: ${{ inputs.updater_artifact != '' }}
        env:
          VERSION: ${{ inputs.cargo_packager_version }}
          SELF_HOSTED: ${{ inputs.runner != 'github' }}
        run: |
          set -euo pipefail
          if [ "$SELF_HOSTED" = "true" ]; then root="$HOME/ci/tools/cargo-packager-$VERSION"; else root="$RUNNER_TEMP/cargo-packager"; fi
          if [ ! -x "$root/bin/cargo-packager" ]; then
            CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-packager-build" cargo install cargo-packager --locked --version "$VERSION" --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Sign APK for the updater
        id: updater
        if: ${{ inputs.updater_artifact != '' }}
        env:
          PREFIX: ${{ steps.paths.outputs.prefix }}
          ARTIFACT: ${{ inputs.updater_artifact }}
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$SIGN_KEY" ] || { echo "::error::updater_artifact richiede il secret TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          mapfile -t apks < <(find "${PREFIX:-.}" -path '*/build/outputs/apk/*' -name '*.apk')
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::attesi 1 APK per updater_artifact, trovati ${#apks[@]}: ${apks[*]:-}"; exit 1; }
          out="$RUNNER_TEMP/updater-apk"; rm -rf "$out"; mkdir -p "$out"
          # Nome unico per ABI (<repo>-android-arm64.apk): gli asset di una release sono piatti, e
          # app-direct-release.apk sarebbe lo stesso per tutte le ABI.
          name="${GITHUB_REPOSITORY#*/}-${ARTIFACT#packages-}.apk"
          cp "${apks[0]}" "$out/$name"
          cargo packager signer sign --private-key "$SIGN_KEY" --password "$SIGN_PASSWORD" "$out/$name"
          ls -la "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # Quota piena o rete: non devono far fallire una build riuscita né impedire l'invio su Telegram
      # (che parte dai file sul runner, nello step finale). L'esito sta in «Artifact warnings».
      - name: Save dependency archives (S3)
        if: ${{ success() && steps.profile.outputs.s3c == 'true' }}
        uses: GabryXnLab/build-kit/s3-cache@main
        with:
          mode: save
          stack: android
          items: |
            ${{ env.S3C_GRADLE }}
            ${{ env.S3C_WRAPPER }}
            ${{ env.S3C_CARGO }}
          cache_env: ${{ steps.profile.outputs.value == 'ephemeral' && secrets.BUILD_CACHE_S3 || '' }}

      - name: Upload updater package
        id: upload_updater
        if: ${{ inputs.updater_artifact != '' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.updater_artifact }}
          path: ${{ steps.updater.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

      - name: Remove signing material
        if: ${{ always() && steps.signing.outputs.dir != '' }}
        env:
          SIGNING_DIR: ${{ steps.signing.outputs.dir }}
        run: rm -rf "$SIGNING_DIR"

      # La quota di storage degli artifact è dell'org e piena non deve far fallire una build
      # riuscita: la consegna vera è il file su Telegram.
      - name: Upload artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || inputs.app_name }}-${{ github.sha }}
          path: |
            ${{ steps.paths.outputs.prefix }}**/build/outputs/apk/**/*.apk
            ${{ steps.paths.outputs.prefix }}**/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 3

      - name: Artifact warnings
        id: warnings
        if: ${{ always() }}
        env:
          APK_OUTCOME: ${{ steps.upload_apk.outcome }}
          UPDATER_OUTCOME: ${{ steps.upload_updater.outcome }}
          UPDATER_NAME: ${{ inputs.updater_artifact }}
          PREFIX: ${{ steps.paths.outputs.prefix }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/artifact-warnings.txt"; : > "$out"
          warn() { echo "::warning::$1"; echo "$1" >> "$out"; }
          if [ "$APK_OUTCOME" = "failure" ]; then
            warn "Upload artifact APK fallito (quota artifact piena?): l'APK è comunque su Telegram, non negli artifact del run."
          fi
          if [ "$UPDATER_OUTCOME" = "failure" ]; then
            warn "Upload $UPDATER_NAME fallito (quota artifact piena?): la release NON potrà raccogliere gli APK, va rilanciata a quota libera."
          fi
          # sendDocument della Bot API cloud accetta fino a 50 MB; con un server locale sul runner il limite è ~2 GB.
          while IFS= read -r f; do
            bytes=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$bytes" -gt 52428800 ]; then
              warn "$(basename "$f") pesa $((bytes / 1024 / 1024)) MB: oltre 50 MB Telegram lo accetta solo con un server Bot API locale sul runner."
            fi
          done < <(find "${PREFIX:-.}" -path '*/build/outputs/apk/*' -name '*.apk' 2>/dev/null)
          exit 0

      - name: Cache summary
        id: cache_summary
        if: ${{ always() }}
        uses: GabryXnLab/build-kit/summary@main
        with:
          token: ${{ secrets.RUNNER_PICK_TOKEN || github.token }}
          stack: android
          profile: ${{ steps.profile.outputs.value }}

      - name: Notify via Telegram
        if: ${{ always() }}
        uses: GabryXnLab/build-kit/notify@main
        with:
          message_id: ${{ steps.started.outputs.message_id }}
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }} ${{ inputs.debug && 'debug' || 'release' }} (Android)
          details_file: ${{ runner.temp }}/artifact-warnings.txt
          files: |
            ${{ steps.paths.outputs.prefix }}**/build/outputs/apk/**/*.apk
            ${{ steps.paths.outputs.prefix }}**/build/outputs/bundle/**/*.aab
